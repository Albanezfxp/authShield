name: CI/CD Pipeline - Build, Test & Code Quality

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: "20"

jobs:
  # Job 1: Build Backend
  build-backend:
    name: 🔨 Build Backend (NestJS)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "auth_project_backend/package-lock.json"

      - name: 📚 Install dependencies
        run: cd auth_project_backend && npm ci

      - name: 🏗️ Build backend
        run: cd auth_project_backend && npm run build

      - name: ✅ Run backend tests
        run: cd auth_project_backend && npm run test -- --passWithNoTests || true

      - name: 📊 Generate coverage report
        run: cd auth_project_backend && npm run test:cov || true
        continue-on-error: true

  # Job 2: Build Frontend
  build-frontend:
    name: 🎨 Build Frontend (React)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: "auth_project_frontend/package-lock.json"

      - name: 📚 Install dependencies
        run: cd auth_project_frontend && npm ci

      - name: 🏗️ Build frontend
        run: cd auth_project_frontend && npm run build

      - name: ✅ Run frontend tests
        run: cd auth_project_frontend && npm run test -- --passWithNoTests || true

  # Job 3: Lint & Code Quality Check
  lint:
    name: 🔍 Linting & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📚 Install backend dependencies
        run: cd auth_project_backend && npm ci

      - name: 🔎 Lint backend (if eslint exists)
        run: cd auth_project_backend && npm run lint || echo "⚠️ ESLint not configured"
        continue-on-error: true

      - name: 📚 Install frontend dependencies
        run: cd auth_project_frontend && npm ci

      - name: 🔎 Lint frontend (if eslint exists)
        run: cd auth_project_frontend && npm run lint || echo "⚠️ ESLint not configured"
        continue-on-error: true

  # Job 4: SonarCloud Code Quality Gate
  sonarcloud:
    name: ☁️ SonarCloud Code Quality Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📚 Install backend dependencies
        run: cd auth_project_backend && npm ci

      - name: 🧪 Run backend coverage
        run: cd auth_project_backend && npm run test:cov || npm run test -- --coverage || true
        continue-on-error: true

      - name: 📤 SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Job 5: Docker Build Check
  docker-build:
    name: 🐳 Docker Build Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔨 Build backend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./auth_project_backend
          file: ./auth_project_backend/Dockerfile.backend
          push: false
          tags: authshield-backend:latest

      - name: 🔨 Build frontend Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./auth_project_frontend
          file: ./auth_project_frontend/Dockerfile.frontend
          push: false
          tags: authshield-frontend:latest

  # Job 6: Overall Status Check
  pipeline-status:
    name: ✅ Pipeline Status Check
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, lint, sonarcloud, docker-build]
    if: always()

    steps:
      - name: 📊 Check build status
        run: |
          if [ "${{ needs.build-backend.result }}" == "failure" ] || \
             [ "${{ needs.build-frontend.result }}" == "failure" ] || \
             [ "${{ needs.sonarcloud.result }}" == "failure" ]; then
            echo "❌ Pipeline failed!"
            exit 1
          else
            echo "✅ Pipeline succeeded!"
          fi

  # Job 7: Summary Report
  summary:
    name: 📋 Execution Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend, lint, sonarcloud, docker-build]
    if: always()

    steps:
      - name: 📝 Print Summary
        run: |
          echo "═══════════════════════════════════════"
          echo "        🚀 PIPELINE EXECUTION SUMMARY"
          echo "═══════════════════════════════════════"
          echo "✅ Backend Build:     ${{ needs.build-backend.result }}"
          echo "✅ Frontend Build:    ${{ needs.build-frontend.result }}"
          echo "✅ Linting:           ${{ needs.lint.result }}"
          echo "✅ SonarCloud:        ${{ needs.sonarcloud.result }}"
          echo "✅ Docker Build:      ${{ needs.docker-build.result }}"
          echo "═══════════════════════════════════════"
          echo ""
          echo "📊 Next: Check SonarCloud Dashboard"
          echo "🔗 https://sonarcloud.io"
          echo "═══════════════════════════════════════"
