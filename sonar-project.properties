# SonarCloud Configuration
sonar.projectKey=Albanezfxp_authShield
sonar.organization=albanezfxp

# Project Info
sonar.projectName=authShield - Task Manager with Auth
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source Code (apenas TypeScript, não mistura JS)
sonar.sources=auth_project_backend/src,auth_project_frontend/src
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/build/**

# Especificar linguagens (remove conflito)
sonar.lang.patterns.ts=**/*.ts,**/*.tsx
sonar.lang.patterns.js=

# Test Coverage
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**
sonar.javascript.lcov.reportPaths=auth_project_backend/coverage/lcov.info,auth_project_frontend/coverage/lcov.info

# Backend (NestJS)
sonar.typescript.node.maxBodyLength=250

# Quality Gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300